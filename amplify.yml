version: 1
frontend:
  phases:
    preBuild:
      commands:
        - curl -s https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.16.9-stable.tar.xz | tar xJ -C /tmp
        - export PATH="$PATH:/tmp/flutter/bin"
        - flutter config --no-analytics
        - flutter pub get
    build:
      commands:
        - flutter build web --release
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - /tmp/flutter