version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use dnf (newer package manager on Amazon Linux)
        - dnf install -y xz curl tar
        # Download Flutter
        - curl -L -o flutter.tar.xz https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.16.9-stable.tar.xz
        # Extract
        - tar -xf flutter.tar.xz -C /tmp
        - export PATH="$PATH:/tmp/flutter/bin"
        - flutter config --no-analytics
        - flutter pub get
    build:
      commands:
        - flutter build web --release --verbose
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - /tmp/flutter